<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA Trivia Games</title>
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
  <main class="wrap">
    <h1>🏀 NBA Trivia Games</h1>
    <p class="sub">Pick a game and test your hoops knowledge.</p>

    <div class="grid" id="games"></div>
    <p class="sub" id="empty">No games yet. Check back soon!</p>
  </main>

  <script src="shared/utils.js"></script>
  <script>
    // To add a game: create games/<id>/index.html and add an entry here.
    const GAMES = [
      { id: "millionaire", emoji: "💰", title: "NBA Who Wants to Be a Millionaire",
        desc: "15 questions from Easy to Expert, three lifelines and a $1,000,000 top prize." },
      { id: "jeopardy", emoji: "🟦", title: "NBA Jeopardy!",
        desc: "Play solo with typed answers, or host a game for up to 6 players with a separate player screen." },
    ];

    document.getElementById("empty").hidden = GAMES.length > 0;
    document.getElementById("games").innerHTML = GAMES.map(g => `
      <a class="game-card" href="games/${g.id}/">
        <div class="emoji">${g.emoji}</div>
        <h2>${g.title}</h2>
        <p>${g.desc}</p>
        <div class="best">${getBest(g.id) ? "Your best: " + getBest(g.id) : ""}</div>
      </a>`).join("");
  </script>
</body>
</html>
