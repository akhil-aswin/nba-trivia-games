<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classic Quiz · NBA Trivia</title>
  <link rel="stylesheet" href="../../shared/styles.css">
</head>
<body>
  <main class="wrap">
    <header class="site"><a class="home" href="../../">← All games</a></header>
    <h1>❓ Classic Quiz</h1>
    <p class="sub">10 random questions. How many can you get?</p>

    <section class="card" id="play">
      <div class="hud"><span id="progress"></span><span id="score"></span></div>
      <p class="question" id="question"></p>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback"></p>
      <button class="primary hidden" id="next">Next →</button>
    </section>

    <section class="card hidden" id="done">
      <h2>Final score</h2>
      <div class="big-score" id="final"></div>
      <p class="sub" id="best"></p>
      <div class="actions">
        <button class="primary" id="again">Play again</button>
      </div>
    </section>
  </main>

  <script src="../../shared/utils.js"></script>
  <script src="questions.js"></script>
  <script src="game.js"></script>
</body>
</html>
